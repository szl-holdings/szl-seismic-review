name: CI
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned requirements
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Verify syntax and tests
        run: |
          python -m compileall -q app.py scripts tests
          python -m pytest -q tests
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned browser requirements
        run: python -m pip install --disable-pip-version-check -r requirements-browser.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Verify catalogue and evidence in Chromium
        run: python tests/browser_smoke.py --output-dir artifacts/browser
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: seismic-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/browser/
          if-no-files-found: warn
          retention-days: 7
