name: Publish Seismic Review to Hugging Face

# Sole application-file writer for SZLHOLDINGS/szl-seismic-review.
# The readiness job verifies CI and CodeQL at the exact dispatched main commit.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hf-sync-szl-seismic-review
  cancel-in-progress: false

jobs:
  readiness:
    if: github.repository == 'szl-holdings/szl-seismic-review' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      checks: read
      contents: read
      security-events: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Require successful exact-source CI and CodeQL
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: python scripts/check_release_readiness.py --sha "$SOURCE_SHA"

  publish:
    needs: readiness
    if: github.repository == 'szl-holdings/szl-seismic-review' && github.ref == 'refs/heads/main'
    uses: szl-holdings/.github/.github/workflows/reusable-hf-deploy-seismic.yml@70b385e4e3e4ddb65085c1dff350bd4e283b6f17
    with:
      hf-repo: SZLHOLDINGS/szl-seismic-review
      ref: ${{ github.sha }}
      dockerfile-path: Dockerfile
      source-revision-file: SOURCE_REVISION
      source-revision-variable: SZL_SOURCE_REVISION
      source-revision-probe-path: /api/build-info
      require-default-branch-tip: true
      include-readme: true
      smoke-paths: '["/", "/healthz", "/api/meta", "/api/summary", "/api/build-info", "/api/evidence"]'
      prune: false
      wait-running: 600
      restart-space: false
    secrets:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

  verify-runtime:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify public runtime against the published source
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: python scripts/verify_deployment.py --sha "$SOURCE_SHA" --output artifacts/runtime-verification.json
      - name: Install pinned browser requirements
        run: python -m pip install --disable-pip-version-check -r requirements-browser.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Verify live search, filters, exports and evidence views
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: python tests/browser_smoke.py --live --sha "$SOURCE_SHA" --output-dir artifacts/live-browser
      - name: Retain runtime observations including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: seismic-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/runtime-verification.json
            artifacts/live-browser/
          if-no-files-found: error
          retention-days: 30
